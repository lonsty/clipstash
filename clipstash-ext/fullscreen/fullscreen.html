<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipStash - Fullscreen</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <link rel="stylesheet" href="fullscreen.css">
</head>
<body class="fullscreen-body">

  <!-- Header bar -->
  <header class="fs-header">
    <div class="fs-header-left">
      <span id="fs-header-id" class="modal-header-id"></span>
    </div>
    <!-- Edit mode bar (hidden in normal mode) -->
    <div id="fs-edit-bar" class="modal-edit-bar" style="display:none;">
      <div class="edit-bar-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <span data-i18n="editing"></span>
      </div>
      <div class="edit-bar-actions">
        <button id="btn-edit-cancel" class="btn btn-ghost btn-sm" data-i18n="cancelEdit"></button>
        <button id="btn-edit-save" class="btn btn-primary btn-sm" data-i18n="saveEdit"></button>
      </div>
    </div>
    <div id="fs-header-actions" class="fs-header-actions"></div>
  </header>

  <!-- Content area -->
  <div class="fs-body">
    <!-- Floating toolbar (copy + edit) -->
    <div id="fs-content-toolbar" class="modal-content-toolbar">
      <button id="btn-fs-copy" class="toolbar-btn" data-i18n-title="copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
      <button id="btn-fs-edit" class="toolbar-btn" data-i18n-title="edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    </div>
    <pre id="fs-content" class="modal-content" style="display:none;"><code id="fs-code"></code></pre>
    <div id="fs-editor-container" class="modal-editor-container" style="display:none;"></div>
    <div id="fs-image-wrap" class="modal-image-wrap" style="display:none;">
      <img id="fs-image" class="modal-image" alt="">
    </div>
    <div id="fs-html-wrap" class="modal-html-wrap" style="display:none;"></div>
  </div>

  <!-- Status bar -->
  <div class="fs-status-bar">
    <span id="fs-status-meta" class="modal-status-meta"></span>
    <select id="fs-lang-select" class="modal-lang-select" data-i18n-title="syntaxLang">
      <option value="">Plain Text</option>
      <option value="bash">Bash</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="csharp">C#</option>
      <option value="css">CSS</option>
      <option value="diff">Diff</option>
      <option value="dockerfile">Dockerfile</option>
      <option value="go">Go</option>
      <option value="html">HTML</option>
      <option value="ini">INI</option>
      <option value="java">Java</option>
      <option value="javascript">JavaScript</option>
      <option value="json">JSON</option>
      <option value="kotlin">Kotlin</option>
      <option value="lua">Lua</option>
      <option value="markdown">Markdown</option>
      <option value="php">PHP</option>
      <option value="python">Python</option>
      <option value="r">R</option>
      <option value="ruby">Ruby</option>
      <option value="rust">Rust</option>
      <option value="scss">SCSS</option>
      <option value="shell">Shell</option>
      <option value="sql">SQL</option>
      <option value="swift">Swift</option>
      <option value="toml">TOML</option>
      <option value="typescript">TypeScript</option>
      <option value="xml">XML</option>
      <option value="yaml">YAML</option>
    </select>
  </div>

  <!-- Tags section -->
  <div class="fs-tags-section">
    <div id="fs-tags" class="modal-tags"></div>
    <div id="fs-tag-input-wrap" class="tag-input-wrap" style="display: none;">
      <input id="fs-tag-input" type="text" class="tag-input" data-i18n-placeholder="tagInputPlaceholder" maxlength="20">
      <div id="fs-tag-suggestions" class="tag-suggestions" style="display: none;"></div>
    </div>
    <button id="btn-fs-add-tag" class="btn-add-tag-inline" data-i18n-title="addTagHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span class="btn-add-tag-label" data-i18n="addTagHint"></span>
    </button>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-overlay" class="modal-overlay" style="display: none;">
    <div class="confirm-dialog">
      <p id="confirm-title" class="confirm-title"></p>
      <p id="confirm-desc" class="confirm-desc"></p>
      <div class="confirm-actions">
        <button id="btn-confirm-cancel" class="btn btn-ghost" data-i18n="cancel"></button>
        <button id="btn-confirm-ok" class="btn btn-danger"></button>
      </div>
    </div>
  </div>

  <script src="fullscreen.js" type="module"></script>
</body>
</html>
