<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>ClipStash</title>
  <link rel="stylesheet" href="popup.css">
  <link id="hljs-theme" rel="stylesheet" href="../vendor/hljs-light.css">
  <script src="../vendor/highlight.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <img class="header-icon" src="../icons/icon128.png" alt="ClipStash" width="20" height="20">
      <h1 class="header-title">ClipStash</h1>
    </div>
    <div class="header-center">
      <button id="btn-cache-now" class="btn btn-primary btn-sm btn-cache-now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        <span data-i18n="cacheNow"></span>
      </button>
    </div>
    <div class="header-right">
      <button id="btn-sync-quick" class="btn-icon btn-sync-quick" style="display: none;" data-i18n-title="syncQuickTooltip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>
      <a id="btn-github" class="btn-icon" href="https://github.com/lonsty/clipstash" target="_blank" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
      </a>
      <button id="btn-settings" class="btn-icon" data-i18n-title="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search-input" type="text" class="search-input" data-i18n-placeholder="searchPlaceholder">
    <button id="btn-search-clear" class="btn-icon search-clear" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Stats Bar -->
  <div id="stats-bar" class="stats-bar">
    <span id="stats-text"></span>
    <button id="btn-trash" class="btn-trash" style="display: none;" title="">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      <span id="trash-count"></span>
    </button>
  </div>

  <!-- Scrollable Content Area -->
  <div id="scroll-container" class="scroll-container">
    <!-- Cache List -->
    <main id="cache-list" class="cache-list"></main>

    <!-- Loading Indicator -->
    <div id="loading-more" class="loading-more" style="display: none;">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
      </svg>
      <p class="empty-title" data-i18n="emptyTitle"></p>
      <p class="empty-desc" data-i18n="emptyDesc"></p>
    </div>

    <!-- No Results State -->
    <div id="no-results" class="empty-state" style="display: none;">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <p class="empty-title" data-i18n="noResultsTitle"></p>
      <p class="empty-desc" data-i18n="noResultsDesc"></p>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <!-- Normal mode: clip ID badge -->
        <span id="modal-header-id" class="modal-header-id"></span>
        <span id="modal-meta" class="modal-meta"></span>
        <!-- Edit mode: indicator bar (hidden in normal mode) -->
        <div id="modal-edit-bar" class="modal-edit-bar" style="display:none;">
          <div class="edit-bar-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span data-i18n="editing"></span>
          </div>
          <div class="edit-bar-actions">
            <button id="btn-edit-cancel" class="btn btn-ghost btn-sm" data-i18n="cancelEdit"></button>
            <button id="btn-edit-save" class="btn btn-primary btn-sm" data-i18n="saveEdit"></button>
          </div>
        </div>
        <div class="modal-header-actions">
          <button id="btn-modal-fullscreen" class="btn-icon" data-i18n-title="fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="15 3 21 3 21 9"/>
              <polyline points="9 21 3 21 3 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/>
              <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
          </button>
          <button id="btn-modal-pin" class="btn-icon" data-i18n-title="pinToTop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <path d="M12 17v5"/>
              <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16h14v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1h.5a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5H8a1 1 0 0 1 1 1z"/>
            </svg>
          </button>
          <button id="btn-modal-close" class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <!-- Floating toolbar (copy + edit) - top right of content area -->
        <div id="modal-content-toolbar" class="modal-content-toolbar">
          <button id="btn-modal-copy" class="toolbar-btn" data-i18n-title="copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button id="btn-modal-edit" class="toolbar-btn" data-i18n-title="edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>
        <pre id="modal-content" class="modal-content"><code id="modal-code"></code></pre>
        <div id="modal-editor-container" class="modal-editor-container" style="display:none;">
          <textarea id="modal-editor" class="modal-editor"></textarea>
          <pre id="modal-editor-preview" class="modal-editor-preview"><code id="modal-editor-code"></code></pre>
        </div>
        <div id="modal-image-wrap" class="modal-image-wrap" style="display:none;">
          <img id="modal-image" class="modal-image" alt="">
        </div>
        <div id="modal-html-wrap" class="modal-html-wrap" style="display:none;"></div>
      </div>
      <div class="modal-status-bar">
        <span id="modal-status-meta" class="modal-status-meta"></span>
        <select id="modal-lang-select" class="modal-lang-select" data-i18n-title="syntaxLang">
          <option value="">Plain Text</option>
          <option value="bash">Bash</option>
          <option value="c">C</option>
          <option value="cpp">C++</option>
          <option value="csharp">C#</option>
          <option value="css">CSS</option>
          <option value="diff">Diff</option>
          <option value="dockerfile">Dockerfile</option>
          <option value="go">Go</option>
          <option value="html">HTML</option>
          <option value="ini">INI</option>
          <option value="java">Java</option>
          <option value="javascript">JavaScript</option>
          <option value="json">JSON</option>
          <option value="kotlin">Kotlin</option>
          <option value="lua">Lua</option>
          <option value="markdown">Markdown</option>
          <option value="php">PHP</option>
          <option value="python">Python</option>
          <option value="r">R</option>
          <option value="ruby">Ruby</option>
          <option value="rust">Rust</option>
          <option value="scss">SCSS</option>
          <option value="shell">Shell</option>
          <option value="sql">SQL</option>
          <option value="swift">Swift</option>
          <option value="toml">TOML</option>
          <option value="typescript">TypeScript</option>
          <option value="xml">XML</option>
          <option value="yaml">YAML</option>
        </select>
      </div>
      <div class="modal-tags-section">
        <div id="modal-tags" class="modal-tags"></div>
        <div id="tag-input-wrap" class="tag-input-wrap" style="display: none;">
          <input id="tag-input" type="text" class="tag-input" data-i18n-placeholder="tagInputPlaceholder" maxlength="20">
          <div id="tag-suggestions" class="tag-suggestions" style="display: none;"></div>
        </div>
        <button id="btn-add-tag" class="btn-add-tag-inline" data-i18n-title="addTagHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span class="btn-add-tag-label" data-i18n="addTagHint"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-overlay" class="modal-overlay" style="display: none;">
    <div class="confirm-dialog">
      <p id="confirm-title" class="confirm-title"></p>
      <p id="confirm-desc" class="confirm-desc"></p>
      <div class="confirm-actions">
        <button id="btn-confirm-cancel" class="btn btn-ghost" data-i18n="cancel"></button>
        <button id="btn-confirm-ok" class="btn btn-danger"></button>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-overlay" class="modal-overlay" style="display: none;">
    <div class="settings-panel">
      <div class="settings-header">
        <span class="settings-title" data-i18n="settings"></span>
        <button id="btn-settings-close" class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <!-- Language -->
        <div class="settings-item">
          <label class="settings-label" data-i18n="settingLang"></label>
          <div class="settings-desc" data-i18n="settingLangDesc"></div>
          <div class="settings-lang-btns" id="lang-btns">
            <button class="lang-btn" data-lang="en">English</button>
            <button class="lang-btn" data-lang="zh">中文</button>
          </div>
        </div>
        <!-- Theme -->
        <div class="settings-item">
          <label class="settings-label" data-i18n="settingTheme"></label>
          <div class="settings-desc" data-i18n="settingThemeDesc"></div>
          <div class="settings-theme-btns" id="theme-btns">
            <button class="theme-btn" data-theme="system">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span data-i18n="themeSystem"></span>
            </button>
            <button class="theme-btn" data-theme="light">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <span data-i18n="themeLight"></span>
            </button>
            <button class="theme-btn" data-theme="dark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span data-i18n="themeDark"></span>
            </button>
          </div>
        </div>
        <!-- Cache Limit -->
        <div class="settings-item">
          <label class="settings-label" for="settings-max-cache" data-i18n="settingMaxCache"></label>
          <div class="settings-desc" data-i18n="settingMaxCacheDesc"></div>
          <div class="settings-input-row">
            <input id="settings-max-cache" type="number" class="settings-input" min="10" max="999" step="10">
            <span class="settings-unit" data-i18n="settingUnit"></span>
          </div>
        </div>
        <!-- Shortcut -->
        <div class="settings-item">
          <label class="settings-label" data-i18n="settingShortcut"></label>
          <div class="settings-desc" data-i18n="settingShortcutDesc"></div>
          <div class="settings-shortcut-info">
            <kbd id="shortcut-display" class="shortcut-kbd">Alt+Shift+C</kbd>
            <a id="shortcut-link" class="settings-link" href="#" data-i18n="settingShortcutHint"></a>
          </div>
        </div>
        <!-- Cloud Sync -->
        <div class="settings-item">
          <label class="settings-label" data-i18n="settingSync"></label>
          <div class="settings-desc" data-i18n="settingSyncDesc"></div>
          <!-- Disconnected state: token input + connect -->
          <div id="sync-setup" class="sync-setup">
            <div class="sync-token-row">
              <div class="sync-token-input-wrap">
                <input id="sync-token-input" type="password" class="settings-input sync-token-input" data-i18n-placeholder="syncTokenPlaceholder" autocomplete="off">
                <button id="btn-sync-token-toggle" class="sync-token-toggle" type="button" title="Show / Hide">
                  <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
              <button id="btn-sync-connect" class="btn btn-primary btn-sm" data-i18n="syncConnect"></button>
            </div>
            <div class="sync-token-hint-row">
              <span class="sync-token-hint" data-i18n="syncTokenHint"></span>
              <a id="sync-get-token" class="sync-get-token-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" data-i18n="syncGetToken"></a>
            </div>
            <div id="sync-token-guide" class="sync-token-guide" data-i18n="syncTokenGuide"></div>
          </div>
          <!-- Connected state: status + actions -->
          <div id="sync-connected" class="sync-connected" style="display: none;">
            <div class="sync-status-row">
              <span class="sync-status-dot sync-status-dot--ok"></span>
              <span id="sync-status-text" class="sync-status-text" data-i18n="syncConnected"></span>
              <span class="sync-status-sep">·</span>
              <span id="sync-last-sync" class="sync-last-sync"></span>
            </div>
            <div class="sync-actions-row">
              <button id="btn-sync-now" class="btn btn-primary btn-sm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                  <path d="M21 3v5h-5"/>
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                  <path d="M8 16H3v5"/>
                </svg>
                <span data-i18n="syncNow"></span>
              </button>
              <button id="btn-sync-disconnect" class="btn btn-ghost btn-sm" data-i18n="syncDisconnect"></button>
            </div>
            <div id="sync-result" class="sync-result" style="display: none;"></div>
          </div>
        </div>
        <!-- Auto Sync -->
        <div class="settings-item settings-item--auto-sync">
          <label class="settings-label" data-i18n="settingAutoSync"></label>
          <label class="settings-toggle settings-toggle--auto-sync" id="auto-sync-toggle-wrap">
            <input type="checkbox" id="toggle-auto-sync" disabled>
            <span data-i18n="settingAutoSyncDesc"></span>
          </label>
        </div>
        <!-- Data Management -->
        <div class="settings-item">
          <label class="settings-label" data-i18n="settingData"></label>
          <div class="settings-desc" data-i18n="settingDataDesc"></div>
          <div class="settings-export-row">
            <button id="btn-export" class="btn btn-ghost btn-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span data-i18n="exportData"></span>
            </button>
            <button id="btn-import" class="btn btn-ghost btn-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span data-i18n="importData"></span>
            </button>
            <input id="import-file" type="file" accept=".json" style="display:none;">
          </div>
          <div id="import-status" class="import-status" style="display:none;"></div>
        </div>
        <!-- Danger Zone -->
        <div class="settings-item settings-danger-zone">
          <label class="settings-label" data-i18n="settingDangerZone"></label>
          <div class="settings-desc" data-i18n="settingDangerZoneDesc"></div>
          <div class="settings-danger-zone__actions">
            <button id="btn-move-all-trash" class="btn btn-ghost btn-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span data-i18n="moveAllToTrash"></span>
            </button>
            <button id="btn-delete-all-permanent" class="btn btn-danger btn-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
              <span data-i18n="deleteAllPermanently"></span>
            </button>
          </div>
        </div>
        <!-- About -->
        <div class="settings-about">
          <span class="settings-about-name">ClipStash</span>
          <span id="app-version" class="settings-about-version"></span>
          <a class="settings-about-link" href="https://github.com/lonsty/clipstash" target="_blank">GitHub</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Trash Panel -->
  <div id="trash-overlay" class="modal-overlay" style="display: none;">
    <div class="trash-panel">
      <div class="trash-header">
        <span class="trash-title" data-i18n="trashBin"></span>
        <div class="trash-header__right">
          <div id="trash-batch-actions" class="trash-batch-actions" style="display: none;">
            <button id="btn-trash-restore-all" class="btn btn-ghost btn-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
              <span data-i18n="trashRestoreAll"></span>
            </button>
            <button id="btn-trash-empty-all" class="btn btn-danger btn-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span data-i18n="trashEmptyAll"></span>
            </button>
          </div>
          <button id="btn-trash-close" class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="trash-body" class="trash-body">
        <div id="trash-empty" class="empty-state" style="display: none;">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <p class="empty-title" data-i18n="trashEmpty"></p>
          <p class="empty-desc" data-i18n="trashEmptyDesc"></p>
        </div>
        <div id="trash-list" class="trash-list"></div>
      </div>
    </div>
  </div>

  <!-- Sync Toast -->
  <div id="sync-toast" class="sync-toast" style="display: none;"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
